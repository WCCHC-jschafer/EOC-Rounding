/* Storage: uses Claude artifact storage when present, otherwise browser localStorage (GitHub Pages) */
const appStorage = window.storage || {
  async get(key) {
    const v = localStorage.getItem("eocapp-" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem("eocapp-" + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem("eocapp-" + key);
    return { key, deleted: true };
  },
};

/* ------------------ Storage helpers ------------------ */
const IDX_KEY = "eoc-index";
async function loadIndex() {
  try {
    const r = await appStorage.get(IDX_KEY);
    return r ? JSON.parse(r.value) : [];
  } catch {
    return [];
  }
}
async function saveIndex(idx) {
  try {
    await appStorage.set(IDX_KEY, JSON.stringify(idx));
  } catch (e) {
    console.error("index save failed", e);
  }
}
async function loadInspection(id) {
  try {
    const r = await appStorage.get("eoc-insp-" + id);
    return r ? JSON.parse(r.value) : null;
  } catch {
    return null;
  }
}
async function saveInspection(insp) {
  try {
    await appStorage.set("eoc-insp-" + insp.id, JSON.stringify(insp));
    return true;
  } catch (e) {
    console.error("save failed", e);
    return false;
  }
}
async function deleteInspection(id) {
  try {
    await appStorage.delete("eoc-insp-" + id);
  } catch (e) {
    console.error("delete failed", e);
  }
}

/* ------------------ Photo compression ------------------ */
function compressImage(file, maxDim = 640, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ------------------ PDF generation ------------------ */
let jspdfPromise = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jspdfPromise) {
    jspdfPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = () => resolve(window.jspdf);
      s.onerror = () => reject(new Error("Could not load PDF library"));
      document.head.appendChild(s);
    });
  }
  return jspdfPromise;
}
function imgDims(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.width || 4, h: img.height || 3 });
    img.onerror = () => resolve({ w: 4, h: 3 });
    img.src = dataUrl;
  });
}

/* ------------------ Small UI atoms ------------------ */
function ProgressRing({ done, total, size = 34 }) {
  const pct = total ? done / total : 0;
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.line} strokeWidth="4" />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke={pct === 1 ? C.green : C.ilima}
        strokeWidth="4"
        strokeDasharray={circ}
        strokeDashoffset={circ * (1 - pct)}
        strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset .3s" }}
      />
      <text x="50%" y="54%" dominantBaseline="middle" textAnchor="middle" fontSize="9" fontWeight="700" fill={C.ink}>
        {done}
      </text>
    </svg>
  );
}

function TriToggle({ value, onChange }) {
  const opts = [
    { v: "met", label: "Met", bg: C.green, fg: "#fff" },
    { v: "notmet", label: "Not met", bg: C.clay, fg: "#fff" },
    { v: "na", label: "N/A", bg: C.sage, fg: "#fff" },
  ];
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {opts.map((o) => {
        const active = value === o.v;
        return (
          <button
            key={o.v}
            onClick={() => onChange(active ? null : o.v)}
            style={{
              flex: o.v === "notmet" ? 1.2 : 1,
              padding: "9px 0",
              borderRadius: 10,
              border: `1.5px solid ${active ? o.bg : C.line}`,
              background: active ? o.bg : "#fff",
              color: active ? o.fg : C.sage,
              fontWeight: 600,
              fontSize: 13,
              cursor: "pointer",
              transition: "all .12s",
            }}
          >
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

/* ============================================================ */
function App() {
  const [screen, setScreen] = useState("home"); // home | inspect | report
  const [index, setIndex] = useState([]);
  const [insp, setInsp] = useState(null);
  const [openLoc, setOpenLoc] = useState(null);
  const [saveState, setSaveState] = useState("saved"); // saved | saving | error
  const [pdfBusy, setPdfBusy] = useState(false);
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);
  const locRefs = useRef({});

  useEffect(() => {
    loadIndex().then(setIndex);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  };

  /* ---------- inspection lifecycle ---------- */
  const startInspection = async (dept) => {
    const now = new Date();
    const id = now.getTime().toString(36);
    const fresh = {
      id,
      department: dept,
      date: now.toISOString().slice(0, 10),
      createdAt: now.toISOString(),
      status: "in-progress",
      items: {},
      generalNotes: "",
    };
    setInsp(fresh);
    await saveInspection(fresh);
    const newIdx = [{ id, department: dept, date: fresh.date, status: "in-progress" }, ...index];
    setIndex(newIdx);
    await saveIndex(newIdx);
    setOpenLoc(LOCATIONS[0].id);
    setScreen("inspect");
  };

  const openInspection = async (id) => {
    const data = await loadInspection(id);
    if (!data) {
      showToast("Could not load that inspection");
      return;
    }
    setInsp(data);
    setOpenLoc(null);
    setScreen(data.status === "complete" ? "report" : "inspect");
  };

  const removeInspection = async (id) => {
    await deleteInspection(id);
    const newIdx = index.filter((x) => x.id !== id);
    setIndex(newIdx);
    await saveIndex(newIdx);
    showToast("Inspection deleted");
  };

  /* ---------- debounced persistence ---------- */
  const persist = useCallback((next) => {
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const ok = await saveInspection(next);
      setSaveState(ok ? "saved" : "error");
      if (!ok) showToast("Save failed — storage limit? Try fewer photos.");
    }, 700);
  }, []);

  const updateItem = (itemId, patch) => {
    setInsp((prev) => {
      const cur = prev.items[itemId] || { status: null, note: "", photos: [] };
      const next = { ...prev, items: { ...prev.items, [itemId]: { ...cur, ...patch } } };
      persist(next);
      return next;
    });
  };

  const updateInsp = (patch) => {
    setInsp((prev) => {
      const next = { ...prev, ...patch };
      persist(next);
      return next;
    });
  };

  const finishInspection = async () => {
    const next = { ...insp, status: "complete", completedAt: new Date().toISOString() };
    setInsp(next);
    await saveInspection(next);
    const newIdx = index.map((x) => (x.id === insp.id ? { ...x, status: "complete" } : x));
    setIndex(newIdx);
    await saveIndex(newIdx);
    setScreen("report");
  };

  const reopenInspection = async () => {
    const next = { ...insp, status: "in-progress" };
    setInsp(next);
    await saveInspection(next);
    const newIdx = index.map((x) => (x.id === insp.id ? { ...x, status: "in-progress" } : x));
    setIndex(newIdx);
    await saveIndex(newIdx);
    setScreen("inspect");
  };

  /* ---------- derived ---------- */
  const locStats = (loc) => {
    let done = 0,
      findings = 0;
    loc.items.forEach((_, i) => {
      const it = insp?.items[`${loc.id}-${i}`];
      if (it?.status) done++;
      if (it?.status === "notmet") findings++;
    });
    return { done, findings, total: loc.items.length };
  };

  const totals = () => {
    let done = 0,
      findings = 0,
      photos = 0;
    LOCATIONS.forEach((loc) =>
      loc.items.forEach((_, i) => {
        const it = insp?.items[`${loc.id}-${i}`];
        if (it?.status) done++;
        if (it?.status === "notmet") findings++;
        photos += it?.photos?.length || 0;
      })
    );
    return { done, findings, photos };
  };

  /* ---------- export ---------- */
  const buildReport = () => {
    const t = totals();
    const lines = [];
    lines.push("WCCHC ENVIRONMENT OF CARE ROUNDING — IC & EMPLOYEE HEALTH");
    lines.push(`Department: ${insp.department}`);
    lines.push(`Date: ${insp.date}`);
    lines.push(`Items assessed: ${t.done}/${TOTAL_ITEMS}   Findings (Not Met): ${t.findings}`);
    lines.push("");
    LOCATIONS.forEach((loc) => {
      const rows = [];
      loc.items.forEach((text, i) => {
        const it = insp.items[`${loc.id}-${i}`];
        if (!it?.status) return;
        if (it.status === "notmet") {
          rows.push(`  [NOT MET] ${text}${it.note ? ` — ${it.note}` : ""}${it.photos?.length ? ` (${it.photos.length} photo${it.photos.length > 1 ? "s" : ""})` : ""}`);
        } else if (it.status === "na" && it.note) {
          rows.push(`  [N/A] ${text} — ${it.note}`);
        } else if (it.status === "met" && it.note) {
          rows.push(`  [MET] ${text} — ${it.note}`);
        }
      });
      const s = locStats(loc);
      lines.push(`${loc.name.toUpperCase()} — ${s.done}/${s.total} assessed, ${s.findings} finding${s.findings === 1 ? "" : "s"}`);
      if (rows.length) lines.push(...rows);
      lines.push("");
    });
    if (insp.generalNotes?.trim()) {
      lines.push("GENERAL NOTES");
      lines.push(insp.generalNotes.trim());
    }
    return lines.join("\n");
  };

  const copyReport = async () => {
    try {
      await navigator.clipboard.writeText(buildReport());
      showToast("Report copied to clipboard");
    } catch {
      showToast("Copy failed — long-press the text to copy");
    }
  };

  const downloadPdf = async () => {
    if (pdfBusy) return;
    setPdfBusy(true);
    try {
      const { jsPDF } = await loadJsPDF();
      const doc = new jsPDF({ unit: "pt", format: "letter" });
      const W = 612,
        H = 792,
        M = 54,
        maxW = W - 2 * M;
      let y = M;
      const pageBreak = (need) => {
        if (y + need > H - 60) {
          doc.addPage();
          y = M;
        }
      };

      /* Header */
      doc.addImage(LOGO, "PNG", M, y, 122, 43);
      y += 60;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.setTextColor(33, 56, 44);
      doc.text("Environment of Care Rounding", M, y);
      y += 17;
      doc.setFontSize(11);
      doc.setTextColor(110, 143, 125);
      doc.text("Infection Control & Employee Health", M, y);
      y += 22;
      const t = totals();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(33, 56, 44);
      doc.text(`Department: ${insp.department}`, M, y);
      y += 14;
      doc.text(`Date of inspection: ${insp.date}`, M, y);
      y += 14;
      doc.text(`Items assessed: ${t.done} of ${TOTAL_ITEMS}     Findings (Not Met): ${t.findings}`, M, y);
      y += 10;
      doc.setDrawColor(242, 198, 90);
      doc.setLineWidth(3);
      doc.line(M, y, M + 90, y);
      y += 20;

      /* Sections */
      for (const loc of LOCATIONS) {
        const s = locStats(loc);
        if (s.done === 0) continue;
        const rows = [];
        loc.items.forEach((text, i) => {
          const it = insp.items[`${loc.id}-${i}`];
          if (!it?.status) return;
          if (it.status === "notmet")
            rows.push({ tag: "NOT MET", text, note: it.note, photos: it.photos || [], color: [176, 74, 47] });
          else if (it.note)
            rows.push({
              tag: it.status === "na" ? "N/A" : "MET",
              text,
              note: it.note,
              photos: it.photos || [],
              color: it.status === "na" ? [110, 143, 125] : [80, 165, 131],
            });
        });

        pageBreak(46);
        doc.setFillColor(80, 165, 131);
        doc.rect(M, y, maxW, 20, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor(255, 255, 255);
        doc.text(
          `${loc.name}  \u2014  ${s.done}/${s.total} assessed, ${s.findings} finding${s.findings === 1 ? "" : "s"}`,
          M + 8,
          y + 13.5
        );
        y += 28;

        if (!rows.length) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(9.5);
          doc.setTextColor(110, 143, 125);
          doc.text("No findings; no comments recorded.", M + 4, y);
          y += 18;
          continue;
        }

        for (const r of rows) {
          doc.setFontSize(9.5);
          doc.setFont("helvetica", "bold");
          const headLines = doc.splitTextToSize(`[${r.tag}]  ${r.text}`, maxW - 8);
          doc.setFont("helvetica", "normal");
          const noteLines = r.note ? doc.splitTextToSize(r.note, maxW - 20) : [];
          pageBreak(headLines.length * 12 + noteLines.length * 11 + 14);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(r.color[0], r.color[1], r.color[2]);
          doc.text(headLines, M + 4, y);
          y += headLines.length * 12;
          if (noteLines.length) {
            doc.setFont("helvetica", "normal");
            doc.setTextColor(70, 70, 70);
            doc.text(noteLines, M + 14, y);
            y += noteLines.length * 11;
          }
          if (r.photos.length) {
            y += 4;
            const pw = 150;
            let x = M + 14;
            let rowH = 0;
            for (const p of r.photos) {
              const d = await imgDims(p);
              const ph = Math.min(Math.round((pw * d.h) / d.w), 220);
              if (x + pw > W - M) {
                y += rowH + 8;
                x = M + 14;
                rowH = 0;
              }
              if (y + ph > H - 60) {
                doc.addPage();
                y = M;
                x = M + 14;
                rowH = 0;
              }
              try {
                doc.addImage(p, "JPEG", x, y, pw, ph);
              } catch (e) {
                console.error("photo embed failed", e);
              }
              rowH = Math.max(rowH, ph);
              x += pw + 8;
            }
            y += rowH + 10;
          }
          y += 8;
        }
        y += 4;
      }

      /* General notes */
      if (insp.generalNotes?.trim()) {
        pageBreak(40);
        doc.setFillColor(33, 56, 44);
        doc.rect(M, y, maxW, 20, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor(255, 255, 255);
        doc.text("General Notes", M + 8, y + 13.5);
        y += 28;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.setTextColor(33, 56, 44);
        const gLines = doc.splitTextToSize(insp.generalNotes.trim(), maxW - 8);
        for (let i = 0; i < gLines.length; i += 40) {
          const chunk = gLines.slice(i, i + 40);
          pageBreak(chunk.length * 12 + 6);
          doc.text(chunk, M + 4, y);
          y += chunk.length * 12;
        }
      }

      /* Footer on every page */
      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(110, 143, 125);
        doc.text("Waianae Coast Comprehensive Health Center \u2014 EOC Rounding, IC & Employee Health", M, H - 36);
        doc.text(`Page ${i} of ${pages}`, W - M, H - 36, { align: "right" });
      }

      const fname = `EOC_${insp.department.replace(/[^\w\u00C0-\u024F-]+/g, "_")}_${insp.date}.pdf`;
      try {
        doc.save(fname);
        showToast("PDF ready — check your downloads / share sheet");
      } catch {
        window.open(doc.output("bloburl"), "_blank");
      }
    } catch (e) {
      console.error(e);
      showToast("PDF generation failed — check your connection and retry");
    } finally {
      setPdfBusy(false);
    }
  };

  /* ============================================================
     RENDER
     ============================================================ */
  const shell = {
    minHeight: "100vh",
    background: C.cream,
    color: C.ink,
    fontFamily: "'Poppins', -apple-system, 'Segoe UI', sans-serif",
    maxWidth: 560,
    margin: "0 auto",
  };

  const fontLink = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
      * { box-sizing: border-box; }
      textarea, input { font-family: inherit; }
      button { font-family: inherit; }
    `}</style>
  );

  /* ---------------- HOME ---------------- */
  if (screen === "home") {
    return (
      <div style={shell}>
        {fontLink}
        <div style={{ height: 6, background: C.greenDark }} />
        <header style={{ padding: "20px 20px 14px" }}>
          <img src={LOGO} alt="Waianae Coast Comprehensive Health Center" style={{ width: 210, height: "auto", display: "block", marginBottom: 16 }} />
          <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: C.sage, fontWeight: 600 }}>
            Infection Control · Employee Health
          </div>
          <h1 style={{ margin: "4px 0 0", fontSize: 26, fontWeight: 700, lineHeight: 1.15, color: C.greenDark }}>
            EOC Rounding
          </h1>
          <div style={{ height: 4, width: 56, background: C.ilima, borderRadius: 2, marginTop: 10 }} />
        </header>

        <NewInspectionForm onStart={startInspection} />

        <section style={{ padding: "6px 20px 40px" }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.sage, textTransform: "uppercase", letterSpacing: 1.4, margin: "18px 0 10px" }}>
            Past & in-progress rounds
          </div>
          {index.length === 0 && (
            <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 22, textAlign: "center", color: C.sage, fontSize: 14 }}>
              No inspections yet. Enter a department above to start your first round.
            </div>
          )}
          {index.map((x) => (
            <div
              key={x.id}
              style={{
                background: C.card,
                border: `1px solid ${C.line}`,
                borderLeft: `4px solid ${x.status === "complete" ? C.green : C.ilima}`,
                borderRadius: 12,
                padding: "12px 14px",
                marginBottom: 10,
                display: "flex",
                alignItems: "center",
                gap: 10,
              }}
            >
              <div style={{ flex: 1, minWidth: 0 }} onClick={() => openInspection(x.id)}>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{x.department}</div>
                <div style={{ fontSize: 12, color: C.sage }}>
                  {x.date} · {x.status === "complete" ? "Complete" : "In progress"}
                </div>
              </div>
              <button
                onClick={() => openInspection(x.id)}
                style={{ background: C.green, color: "#fff", border: "none", borderRadius: 9, padding: "8px 14px", fontWeight: 600, fontSize: 13, cursor: "pointer" }}
              >
                {x.status === "complete" ? "View" : "Resume"}
              </button>
              <button
                onClick={() => {
                  if (window.confirm(`Delete the ${x.department} inspection from ${x.date}? This cannot be undone.`)) removeInspection(x.id);
                }}
                style={{ background: "none", border: "none", color: C.sage, fontSize: 17, cursor: "pointer", padding: 4 }}
                aria-label="Delete inspection"
              >
                ✕
              </button>
            </div>
          ))}
          <div style={{ textAlign: "center", marginTop: 26, paddingTop: 14, borderTop: `1px solid ${C.line}`, fontSize: 10.5, color: C.sage, letterSpacing: 0.6 }}>
            WAIANAE COAST COMPREHENSIVE HEALTH CENTER · SERVING WEST OAHU SINCE 1972
          </div>
        </section>
        {toast && <Toast msg={toast} />}
      </div>
    );
  }

  /* ---------------- INSPECT ---------------- */
  if (screen === "inspect" && insp) {
    const t = totals();
    return (
      <div style={{ ...shell, paddingBottom: 90 }}>
        {fontLink}
        {/* Sticky header */}
        <div style={{ position: "sticky", top: 0, zIndex: 20, background: C.cream, borderBottom: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", alignItems: "center", padding: "12px 16px 8px", gap: 10 }}>
            <button onClick={() => setScreen("home")} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: C.ink, padding: 2 }} aria-label="Back">
              ←
            </button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 16, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{insp.department}</div>
              <div style={{ fontSize: 11.5, color: C.sage }}>
                {insp.date} · {t.done}/{TOTAL_ITEMS} assessed
                {t.findings > 0 && <span style={{ color: C.clay, fontWeight: 600 }}> · {t.findings} finding{t.findings > 1 ? "s" : ""}</span>}
              </div>
            </div>
            <div style={{ fontSize: 11, color: saveState === "error" ? C.clay : C.sage, fontWeight: 500 }}>
              {saveState === "saving" ? "Saving…" : saveState === "error" ? "Save failed" : "Saved ✓"}
            </div>
          </div>
          {/* Location rail */}
          <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "4px 16px 10px", WebkitOverflowScrolling: "touch" }}>
            {LOCATIONS.map((loc) => {
              const s = locStats(loc);
              const complete = s.done === s.total;
              return (
                <button
                  key={loc.id}
                  onClick={() => {
                    setOpenLoc(loc.id);
                    setTimeout(() => locRefs.current[loc.id]?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
                  }}
                  style={{
                    flexShrink: 0,
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    background: openLoc === loc.id ? C.ink : C.card,
                    color: openLoc === loc.id ? "#fff" : C.ink,
                    border: `1px solid ${complete ? C.green : C.line}`,
                    borderRadius: 999,
                    padding: "6px 11px 6px 7px",
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: "pointer",
                  }}
                >
                  <ProgressRing done={s.done} total={s.total} size={26} />
                  <span>{loc.name}</span>
                  {s.findings > 0 && (
                    <span style={{ background: C.clay, color: "#fff", borderRadius: 999, fontSize: 10, padding: "1px 6px", fontWeight: 700 }}>{s.findings}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {/* Location sections */}
        <div style={{ padding: "14px 16px" }}>
          {LOCATIONS.map((loc) => {
            const s = locStats(loc);
            const open = openLoc === loc.id;
            return (
              <div key={loc.id} ref={(el) => (locRefs.current[loc.id] = el)} style={{ marginBottom: 12, scrollMarginTop: 118 }}>
                <button
                  onClick={() => setOpenLoc(open ? null : loc.id)}
                  style={{
                    width: "100%",
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    background: open ? C.green : C.card,
                    color: open ? "#fff" : C.ink,
                    border: `1px solid ${open ? C.green : C.line}`,
                    borderRadius: open ? "14px 14px 0 0" : 14,
                    padding: "13px 14px",
                    cursor: "pointer",
                    textAlign: "left",
                  }}
                >
                  <span style={{ fontSize: 18 }}>{loc.icon}</span>
                  <span style={{ flex: 1, fontWeight: 600, fontSize: 15 }}>{loc.name}</span>
                  <span style={{ fontSize: 12, fontWeight: 600, opacity: 0.85 }}>
                    {s.done}/{s.total}
                  </span>
                  <span style={{ fontSize: 13 }}>{open ? "▾" : "▸"}</span>
                </button>

                {open && (
                  <div style={{ background: C.card, border: `1px solid ${C.line}`, borderTop: "none", borderRadius: "0 0 14px 14px", padding: "4px 14px 14px" }}>
                    {/* Mark remaining as Met */}
                    <button
                      onClick={() => {
                        loc.items.forEach((_, i) => {
                          const id = `${loc.id}-${i}`;
                          if (!insp.items[id]?.status) updateItem(id, { status: "met" });
                        });
                      }}
                      style={{ margin: "10px 0 4px", background: "none", border: `1px dashed ${C.sage}`, color: C.sage, borderRadius: 9, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                    >
                      ✓ Mark all remaining in this area as Met
                    </button>
                    {loc.items.map((text, i) => (
                      <ItemRow
                        key={i}
                        text={text}
                        item={insp.items[`${loc.id}-${i}`]}
                        onChange={(patch) => updateItem(`${loc.id}-${i}`, patch)}
                        onToast={showToast}
                      />
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          {/* General notes */}
          <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginTop: 4 }}>
            <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>General notes for this visit</div>
            <textarea
              value={insp.generalNotes}
              onChange={(e) => updateInsp({ generalNotes: e.target.value })}
              placeholder="Observations, staff interviews, follow-ups…"
              rows={3}
              style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 10, padding: 10, fontSize: 14, resize: "vertical", background: C.cream }}
            />
          </div>
        </div>

        {/* Bottom bar */}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 560, margin: "0 auto", background: "#fff", borderTop: `1px solid ${C.line}`, padding: "10px 16px calc(10px + env(safe-area-inset-bottom))", display: "flex", gap: 10, zIndex: 30 }}>
          <button onClick={() => setScreen("report")} style={{ flex: 1, background: "#fff", color: C.ink, border: `1.5px solid ${C.line}`, borderRadius: 11, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
            Preview report
          </button>
          <button onClick={finishInspection} style={{ flex: 1.4, background: C.ink, color: "#fff", border: "none", borderRadius: 11, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
            Finish inspection
          </button>
        </div>
        {toast && <Toast msg={toast} />}
      </div>
    );
  }

  /* ---------------- REPORT ---------------- */
  if (screen === "report" && insp) {
    const t = totals();
    return (
      <div style={{ ...shell, paddingBottom: 40 }}>
        {fontLink}
        <div style={{ height: 6, background: C.greenDark }} />
        <div style={{ padding: "14px 16px 0" }}>
          <img src={LOGO} alt="WCCHC" style={{ width: 170, height: "auto", display: "block" }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px 6px" }}>
          <button onClick={() => setScreen("home")} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: C.ink }} aria-label="Home">
            ←
          </button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 18, color: C.greenDark }}>{insp.department}</div>
            <div style={{ fontSize: 12, color: C.sage }}>
              {insp.date} · {insp.status === "complete" ? "Complete" : "In progress"}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 10, padding: "8px 16px" }}>
          <Stat label="Assessed" value={`${t.done}/${TOTAL_ITEMS}`} color={C.green} />
          <Stat label="Findings" value={t.findings} color={t.findings ? C.clay : C.green} />
          <Stat label="Photos" value={t.photos} color={C.sage} />
        </div>

        <div style={{ padding: "6px 16px", display: "flex", flexDirection: "column", gap: 8 }}>
          <button
            onClick={downloadPdf}
            disabled={pdfBusy}
            style={{ width: "100%", background: pdfBusy ? C.sage : C.greenDark, color: "#fff", border: "none", borderRadius: 11, padding: "14px 0", fontWeight: 600, fontSize: 15, cursor: pdfBusy ? "default" : "pointer" }}
          >
            {pdfBusy ? "Building PDF…" : "⬇ Download PDF report (findings + photos)"}
          </button>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={copyReport} style={{ flex: 1, background: "#fff", color: C.ink, border: `1.5px solid ${C.line}`, borderRadius: 11, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              Copy report text
            </button>
            {insp.status === "complete" ? (
              <button onClick={reopenInspection} style={{ flex: 1, background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 11, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", color: C.ink }}>
                Reopen & edit
              </button>
            ) : (
              <button onClick={() => setScreen("inspect")} style={{ flex: 1, background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 11, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", color: C.ink }}>
                Back to checklist
              </button>
            )}
          </div>
        </div>

        {/* Findings detail with photos */}
        <div style={{ padding: "10px 16px" }}>
          {t.findings === 0 && (
            <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, textAlign: "center", color: C.sage, fontSize: 14 }}>
              No "Not Met" findings recorded. 🎉
            </div>
          )}
          {LOCATIONS.map((loc) => {
            const findings = loc.items
              .map((text, i) => ({ text, it: insp.items[`${loc.id}-${i}`] }))
              .filter((f) => f.it?.status === "notmet");
            if (!findings.length) return null;
            return (
              <div key={loc.id} style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.2, color: C.sage, margin: "10px 0 6px" }}>
                  {loc.icon} {loc.name}
                </div>
                {findings.map((f, k) => (
                  <div key={k} style={{ background: C.card, borderLeft: `4px solid ${C.clay}`, border: `1px solid ${C.line}`, borderLeftWidth: 4, borderLeftColor: C.clay, borderRadius: 12, padding: "11px 13px", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{f.text}</div>
                    {f.it.note && <div style={{ fontSize: 13, color: C.ink, opacity: 0.8, marginTop: 4 }}>{f.it.note}</div>}
                    {f.it.photos?.length > 0 && (
                      <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                        {f.it.photos.map((p, pi) => (
                          <img key={pi} src={p} alt="finding" style={{ width: 84, height: 84, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.line}` }} />
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            );
          })}

          {/* Full text report */}
          <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.2, color: C.sage, margin: "16px 0 6px" }}>
            Text report (copy above, or long-press to select)
          </div>
          <pre style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 14, fontSize: 11.5, whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "ui-monospace, monospace", color: C.ink }}>
            {buildReport()}
          </pre>
        </div>
        {toast && <Toast msg={toast} />}
      </div>
    );
  }

  return <div style={shell}>{fontLink}Loading…</div>;
}

/* ------------------ Sub-components ------------------ */
function NewInspectionForm({ onStart }) {
  const [dept, setDept] = useState("");
  return (
    <div style={{ margin: "8px 20px 4px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>Start a new round</div>
      <input
        value={dept}
        onChange={(e) => setDept(e.target.value)}
        placeholder="Department or clinic (e.g., Dental Clinic)"
        style={{ width: "100%", border: `1.5px solid ${C.line}`, borderRadius: 11, padding: "12px 12px", fontSize: 15, background: C.cream, marginBottom: 10 }}
      />
      <button
        onClick={() => dept.trim() && onStart(dept.trim())}
        disabled={!dept.trim()}
        style={{
          width: "100%",
          background: dept.trim() ? C.green : C.line,
          color: dept.trim() ? "#fff" : C.sage,
          border: "none",
          borderRadius: 11,
          padding: "13px 0",
          fontWeight: 600,
          fontSize: 15,
          cursor: dept.trim() ? "pointer" : "default",
        }}
      >
        Begin inspection
      </button>
    </div>
  );
}

function ItemRow({ text, item, onChange, onToast }) {
  const [expanded, setExpanded] = useState(false);
  const fileRef = useRef(null);
  const status = item?.status || null;
  const hasDetail = (item?.note && item.note.length) || (item?.photos && item.photos.length);
  const showDetail = expanded || status === "notmet" || hasDetail;

  const addPhoto = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    if ((item?.photos?.length || 0) >= 4) {
      onToast("Max 4 photos per item");
      return;
    }
    try {
      const dataUrl = await compressImage(file);
      onChange({ photos: [...(item?.photos || []), dataUrl] });
    } catch {
      onToast("Could not process that photo");
    }
  };

  return (
    <div style={{ borderTop: `1px solid ${C.line}`, padding: "12px 0" }}>
      <div style={{ fontSize: 14, lineHeight: 1.4, marginBottom: 8 }}>{text}</div>
      <TriToggle value={status} onChange={(v) => onChange({ status: v })} />
      {showDetail ? (
        <div style={{ marginTop: 8 }}>
          <textarea
            value={item?.note || ""}
            onChange={(e) => onChange({ note: e.target.value })}
            placeholder={status === "notmet" ? "Describe the finding…" : "Optional comment…"}
            rows={2}
            style={{ width: "100%", border: `1px solid ${status === "notmet" ? C.clay : C.line}`, borderRadius: 10, padding: 9, fontSize: 13.5, background: C.cream, resize: "vertical" }}
          />
          <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap", alignItems: "center" }}>
            {(item?.photos || []).map((p, i) => (
              <div key={i} style={{ position: "relative" }}>
                <img src={p} alt="attached" style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.line}` }} />
                <button
                  onClick={() => onChange({ photos: item.photos.filter((_, k) => k !== i) })}
                  style={{ position: "absolute", top: -6, right: -6, background: C.ink, color: "#fff", border: "none", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer", lineHeight: 1 }}
                  aria-label="Remove photo"
                >
                  ✕
                </button>
              </div>
            ))}
            <button
              onClick={() => fileRef.current?.click()}
              style={{ width: 64, height: 40, background: "#fff", border: `1.5px dashed ${C.sage}`, borderRadius: 8, color: C.sage, fontSize: 12, fontWeight: 600, cursor: "pointer" }}
            >
              📷 Add
            </button>
            <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={addPhoto} style={{ display: "none" }} />
          </div>
        </div>
      ) : (
        <button onClick={() => setExpanded(true)} style={{ marginTop: 6, background: "none", border: "none", color: C.sage, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0 }}>
          + Add note or photo
        </button>
      )}
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderTop: `3px solid ${color}`, borderRadius: 12, padding: "10px 8px", textAlign: "center" }}>
      <div style={{ fontSize: 20, fontWeight: 700, color: C.ink }}>{value}</div>
      <div style={{ fontSize: 11, color: C.sage, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.8 }}>{label}</div>
    </div>
  );
}

function Toast({ msg }) {
  return (
    <div style={{ position: "fixed", bottom: 84, left: "50%", transform: "translateX(-50%)", background: "#21382c", color: "#fff", padding: "10px 18px", borderRadius: 999, fontSize: 13, fontWeight: 500, zIndex: 50, boxShadow: "0 4px 14px rgba(0,0,0,.25)", whiteSpace: "nowrap" }}>
      {msg}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
