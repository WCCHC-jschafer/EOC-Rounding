<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EOC Rounding">
<link rel="apple-touch-icon" href="IMG_5914.png">
<link rel="icon" type="image/png" href="IMG_5914.png">
<title>EOC Rounding — WCCHC IC & Employee Health</title>
<style>
:root{
  --ink:#21382c; --cream:#f7f5ee; --card:#fff; --green:#50A583; --greendark:#3d8268;
  --sage:#6e8f7d; --ilima:#F2C65A; --clay:#b04a2f; --line:#e4e0d3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100vh}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
textarea,input{font-family:inherit;font-size:16px}
.topbar{height:6px;background:var(--greendark)}
header{padding:20px 20px 14px}
.logo{width:210px;height:auto;display:block;margin-bottom:16px}
.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sage);font-weight:600}
h1{margin:4px 0 0;font-size:26px;font-weight:700;line-height:1.15;color:var(--greendark)}
.rule{height:4px;width:56px;background:var(--ilima);border-radius:2px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 20px 4px}
.card h3{margin:0 0 8px;font-size:14px;font-weight:600}
.dept{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:15px;background:var(--cream);margin-bottom:10px}
.btn{border:none;border-radius:11px;font-weight:600;cursor:pointer}
.btn-primary{width:100%;background:var(--green);color:#fff;padding:13px 0;font-size:15px}
.btn-primary:disabled{background:var(--line);color:var(--sage);cursor:default}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.section{padding:6px 20px 40px}
.sechead{font-size:12px;font-weight:600;color:var(--sage);text-transform:uppercase;letter-spacing:1.4px;margin:18px 0 10px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sage);font-size:14px}
.round{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.round.complete{border-left:4px solid var(--green)}
.round.progress{border-left:4px solid var(--ilima)}
.round .info{flex:1;min-width:0;cursor:pointer}
.round .name{font-weight:600;font-size:15px}
.round .meta{font-size:12px;color:var(--sage)}
.round .open{background:var(--green);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.round .del{background:none;border:none;color:var(--sage);font-size:17px;cursor:pointer;padding:4px}
.footer{text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--sage);letter-spacing:.6px}
.warnbox{margin:10px 20px 0;background:#fdf1ec;border:1.5px solid var(--clay);border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.45}
.usage{margin:14px 20px 0;font-size:11.5px;color:var(--sage);text-align:center}
/* inspect */
.sticky{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line)}
.shead{display:flex;align-items:center;padding:12px 16px 8px;gap:10px}
.backbtn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);padding:2px}
.stitle{flex:1;min-width:0}
.stitle .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitle .m{font-size:11.5px;color:var(--sage)}
.findct{color:var(--clay);font-weight:600}
.savestate{font-size:11px;color:var(--sage);font-weight:500}
.savestate.err{color:var(--clay);text-decoration:underline;cursor:pointer}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;-webkit-overflow-scrolling:touch}
.pill{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 7px;font-size:12px;font-weight:600;cursor:pointer}
.pill.active{background:var(--ink);color:#fff}
.pill.done{border-color:var(--green)}
.pill .fbadge{background:var(--clay);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700}
.locwrap{padding:14px 16px 110px}
.locblock{margin-bottom:12px;scroll-margin-top:118px}
.lochead{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;font-size:15px}
.lochead.open{background:var(--green);color:#fff;border-color:var(--green);border-radius:14px 14px 0 0}
.lochead .nm{flex:1;font-weight:600}
.lochead .ct{font-size:12px;font-weight:600;opacity:.85}
.locbody{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:4px 14px 14px}
.markall{margin:10px 0 4px;background:none;border:1px dashed var(--sage);color:var(--sage);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.item{border-top:1px solid var(--line);padding:12px 0}
.itxt{font-size:14px;line-height:1.4;margin-bottom:8px}
.tri{display:flex;gap:6px}
.tbtn{flex:1;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--sage);font-weight:600;font-size:13px;cursor:pointer}
.tbtn.notmet{flex:1.2}
.tbtn.on.met{background:var(--green);border-color:var(--green);color:#fff}
.tbtn.on.notmet{background:var(--clay);border-color:var(--clay);color:#fff}
.tbtn.on.na{background:var(--sage);border-color:var(--sage);color:#fff}
.detail{margin-top:8px}
.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13.5px;background:var(--cream);resize:vertical}
.note.nm{border-color:var(--clay)}
.photorow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.ph{position:relative}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph .x{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border:none;border-radius:999px;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.addph{width:64px;height:40px;background:#fff;border:1.5px dashed var(--sage);border-radius:8px;color:var(--sage);font-size:12px;font-weight:600;cursor:pointer}
.expand{margin-top:6px;background:none;border:none;color:var(--sage);font-size:12px;font-weight:600;cursor:pointer;padding:0}
.gennotes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:4px}
.gennotes .h{font-weight:600;font-size:14px;margin-bottom:8px}
.bottombar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30}
.bottombar .btn{padding:12px 0;font-size:14px}
.bb1{flex:1}.bb2{flex:1.4}
/* report */
.stats{display:flex;gap:10px;padding:8px 16px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--sage);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.stat.g{border-top:3px solid var(--green)}
.stat.c{border-top:3px solid var(--clay)}
.stat.s{border-top:3px solid var(--sage)}
.actions{padding:6px 16px;display:flex;flex-direction:column;gap:8px}
.btn-pdf{width:100%;background:var(--greendark);color:#fff;padding:14px 0;font-size:15px}
.btn-pdf:disabled{background:var(--sage)}
.btn-share{width:100%;background:var(--ilima);color:var(--ink);padding:14px 0;font-size:15px;font-weight:700}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1;padding:12px 0;font-size:14px}
.findsec{padding:10px 16px}
.findloc{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--sage);margin:10px 0 6px}
.finding{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.finding .ft{font-size:14px;font-weight:600}
.finding .fn{font-size:13px;opacity:.8;margin-top:4px}
.finding .fp{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.finding .fp img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.txtreport{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,monospace;margin:0 16px 30px}
.rephead{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.rephead .t{font-weight:700;font-size:18px;color:var(--greendark)}
.rephead .m{font-size:12px;color:var(--sage)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;display:none}
</style>
</head>

/* ------------------ Photo compression ------------------ */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.55;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ------------------ Derived ------------------ */
function locStats(insp, loc){
  var done = 0, findings = 0;
  loc.items.forEach(function(_, i){
    var it = insp.items[loc.id + "-" + i];
    if (it && it.status) done++;
    if (it && it.status === "notmet") findings++;
  });
  return { done: done, findings: findings, total: loc.items.length };
}
function totals(insp){
  var done = 0, findings = 0, photos = 0;
  LOCATIONS.forEach(function(loc){
    loc.items.forEach(function(_, i){
      var it = insp.items[loc.id + "-" + i];
      if (it && it.status) done++;
      if (it && it.status === "notmet") findings++;
      photos += (it && it.photos ? it.photos.length : 0);
    });
  });
  return { done: done, findings: findings, photos: photos };
}
function getItem(insp, id){
  if (!insp.items[id]) insp.items[id] = { status:null, note:"", photos:[] };
  return insp.items[id];
}

/* ------------------ Text report ------------------ */
function buildReport(insp){
  var t = totals(insp), lines = [];
  lines.push("WCCHC ENVIRONMENT OF CARE ROUNDING \u2014 IC & EMPLOYEE HEALTH");
  lines.push("Department: " + insp.department);
  lines.push("Date: " + insp.date);
  lines.push("Items assessed: " + t.done + "/" + TOTAL_ITEMS + "   Findings (Not Met): " + t.findings);
  lines.push("");
  LOCATIONS.forEach(function(loc){
    var rows = [];
    loc.items.forEach(function(text, i){
      var it = insp.items[loc.id + "-" + i];
      if (!it || !it.status) return;
      if (it.status === "notmet"){
        rows.push("  [NOT MET] " + text + (it.note ? " \u2014 " + it.note : "") + (it.photos && it.photos.length ? " (" + it.photos.length + " photo" + (it.photos.length > 1 ? "s" : "") + ")" : ""));
      } else if (it.status === "na" && it.note){
        rows.push("  [N/A] " + text + " \u2014 " + it.note);
      } else if (it.status === "met" && it.note){
        rows.push("  [MET] " + text + " \u2014 " + it.note);
      }
    });
    var s = locStats(insp, loc);
    lines.push(loc.name.toUpperCase() + " \u2014 " + s.done + "/" + s.total + " assessed, " + s.findings + " finding" + (s.findings === 1 ? "" : "s"));
    if (rows.length) lines = lines.concat(rows);
    lines.push("");
  });
  if (insp.generalNotes && insp.generalNotes.trim()){
    lines.push("GENERAL NOTES");
    lines.push(insp.generalNotes.trim());
  }
  return lines.join("\n");
}

/* ------------------ PDF ------------------ */
var jspdfPromise = null;
function loadJsPDF(){
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jspdfPromise){
    jspdfPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = function(){ resolve(window.jspdf); };
      s.onerror = function(){ jspdfPromise = null; reject(new Error("Could not load PDF library \u2014 internet required for PDF export")); };
      document.head.appendChild(s);
    });
  }
  return jspdfPromise;
}
function imgDims(dataUrl){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){ resolve({ w: img.width || 4, h: img.height || 3 }); };
    img.onerror = function(){ resolve({ w: 4, h: 3 }); };
    img.src = dataUrl;
  });
}

        if (it.status === "notmet")
          rows.push({ tag:"NOT MET", text:text, note:it.note, photos:it.photos || [], color:[176,74,47] });
        else if (it.note)
          rows.push({ tag: it.status === "na" ? "N/A" : "MET", text:text, note:it.note, photos:it.photos || [], color: it.status === "na" ? [110,143,125] : [80,165,131] });
      });

      pageBreak(46);
      doc.setFillColor(80,165,131); doc.rect(M, y, maxW, 20, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(255,255,255);
      doc.text(loc.name + "  \u2014  " + s.done + "/" + s.total + " assessed, " + s.findings + " finding" + (s.findings === 1 ? "" : "s"), M + 8, y + 13.5);
      y += 28;

      if (!rows.length){
        doc.setFont("helvetica","italic"); doc.setFontSize(9.5); doc.setTextColor(110,143,125);
        doc.text("No findings; no comments recorded.", M + 4, y); y += 18;
        continue;
      }
      for (var ri = 0; ri < rows.length; ri++){
        var r = rows[ri];
        doc.setFontSize(9.5); doc.setFont("helvetica","bold");
        var headLines = doc.splitTextToSize("[" + r.tag + "]  " + r.text, maxW - 8);
        doc.setFont("helvetica","normal");
        var noteLines = r.note ? doc.splitTextToSize(r.note, maxW - 20) : [];
        pageBreak(headLines.length * 12 + noteLines.length * 11 + 14);
        doc.setFont("helvetica","bold"); doc.setTextColor(r.color[0], r.color[1], r.color[2]);
        doc.text(headLines, M + 4, y); y += headLines.length * 12;
        if (noteLines.length){
          doc.setFont("helvetica","normal"); doc.setTextColor(70,70,70);
          doc.text(noteLines, M + 14, y); y += noteLines.length * 11;
        }
        if (r.photos.length){
          y += 4;
          var pw = 150, x = M + 14, rowH = 0;
          for (var pi = 0; pi < r.photos.length; pi++){
            var p = r.photos[pi];
            var d = await imgDims(p);
            var ph = Math.min(Math.round(pw * d.h / d.w), 220);
            if (x + pw > W - M){ y += rowH + 8; x = M + 14; rowH = 0; }
            if (y + ph > H - 60){ doc.addPage(); y = M; x = M + 14; rowH = 0; }
            try { doc.addImage(p, "JPEG", x, y, pw, ph); } catch(e){ console.error("photo embed failed", e); }
            rowH = Math.max(rowH, ph); x += pw + 8;
          }
          y += rowH + 10;
        }
        y += 8;
      }
      y += 4;
    }

    if (insp.generalNotes && insp.generalNotes.trim()){
      pageBreak(40);
      doc.setFillColor(33,56,44); doc.rect(M, y, maxW, 20, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(255,255,255);
      doc.text("General Notes", M + 8, y + 13.5); y += 28;
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(33,56,44);
      var gLines = doc.splitTextToSize(insp.generalNotes.trim(), maxW - 8);
      for (var gi = 0; gi < gLines.length; gi += 40){
        var chunk = gLines.slice(gi, gi + 40);
        pageBreak(chunk.length * 12 + 6);
        doc.text(chunk, M + 4, y); y += chunk.length * 12;
      }
    }

    var pages = doc.getNumberOfPages();
    for (var pg = 1; pg <= pages; pg++){
      doc.setPage(pg);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(110,143,125);
      doc.text("Waianae Coast Comprehensive Health Center \u2014 EOC Rounding, IC & Employee Health", M, H - 36);
      doc.text("Page " + pg + " of " + pages, W - M, H - 36, { align:"right" });
    }

    var fname = "EOC_" + insp.department.replace(/[^\w\u00C0-\u024F-]+/g, "_") + "_" + insp.date + ".pdf";
    var blob = doc.output("blob");
    if (PDF && PDF.url) URL.revokeObjectURL(PDF.url);
    PDF = { blob: blob, url: URL.createObjectURL(blob), fname: fname };
    toast("PDF built \u2014 tap Share / save below");
  } catch(e){
    console.error(e);
    toast(e && e.message ? e.message : "PDF generation failed \u2014 retry");
  } finally {
    S.pdfBusy = false; render();
  }
}
async function sharePdf(){
  if (!PDF) return;
  try {
    var f = new File([PDF.blob], PDF.fname, { type:"application/pdf" });
    if (navigator.canShare && navigator.canShare({ files:[f] })){
      await navigator.share({ files:[f], title: PDF.fname });
      return;
    }
  } catch(e){
    if (e && e.name === "AbortError") return;
    console.error("share failed", e);
  }
  try {
    var a = document.createElement("a");
    a.href = PDF.url; a.download = PDF.fname;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  } catch(e){ console.error("download failed", e); }
  window.open(PDF.url, "_blank");
}

/* ------------------ Render ------------------ */
function render(){
  var scrollY = window.scrollY;
  var app = document.getElementById("app");
  if (S.screen === "home") app.innerHTML = homeHTML();
  else if (S.screen === "inspect") app.innerHTML = inspectHTML();
  else if (S.screen === "report") app.innerHTML = reportHTML();
  window.scrollTo(0, scrollY);
}

function homeHTML(){
  var list = DB.order.map(function(id){
    var x = DB.insp[id];
    if (!x) return "";
    var complete = x.status === "complete";
    return '<div class="round ' + (complete ? "complete" : "progress") + '">' +
      '<div class="info" data-open="' + id + '"><div class="name">' + esc(x.department) + '</div>' +
      '<div class="meta">' + esc(x.date) + ' \u00B7 ' + (complete ? "Complete" : "In progress") + '</div></div>' +
      '<button class="open" data-open="' + id + '">' + (complete ? "View" : "Resume") + '</button>' +
      '<button class="del" data-del="' + id + '" aria-label="Delete">\u2715</button></div>';
  }).join("");
  var kb = usageBytes();
  var usage = kb ? '<div class="usage">Device storage used by this app: ' + (kb / 1048576).toFixed(1) + ' MB. Export PDFs, then delete old rounds to free space.</div>' : "";
  return '<div class="topbar"></div>' +
    '<header><img class="logo" src="' + LOGO + '" alt="Waianae Coast Comprehensive Health Center">' +
    '<div class="kicker">Infection Control \u00B7 Employee Health</div><h1>EOC Rounding</h1><div class="rule"></div></header>' +
    '<div class="card"><h3>Start a new round</h3>' +
    '<input class="dept" id="deptInput" placeholder="Department or clinic (e.g., Dental Clinic)">' +
    '<button class="btn btn-primary" id="startBtn" disabled>Begin inspection</button></div>' +
    usage +
    '<div class="section"><div class="sechead">Past & in-progress rounds</div>' +
    (list || '<div class="empty">No inspections yet. Enter a department above to start your first round.</div>') +
    '<div class="footer">WAIANAE COAST COMPREHENSIVE HEALTH CENTER \u00B7 SERVING WEST OAHU SINCE 1972<br>All data is stored on this device only.</div></div>';
}

function inspectHTML(){
  var insp = cur();
  var t = totals(insp);
  var rail = LOCATIONS.map(function(loc){
    var s = locStats(insp, loc);
    var cls = "pill" + (S.openLoc === loc.id ? " active" : "") + (s.done === s.total ? " done" : "");
    return '<button class="' + cls + '" data-loc="' + loc.id + '" data-scroll="1">' +
      ring(s.done, s.total) + '<span>' + esc(loc.name) + '</span>' +
      (s.findings ? '<span class="fbadge">' + s.findings + '</span>' : "") + '</button>';
  }).join("");
  var blocks = LOCATIONS.map(function(loc){
    var s = locStats(insp, loc);
    var open = S.openLoc === loc.id;
    var body = "";
    if (open){
      var itemsHtml = loc.items.map(function(text, i){ return itemHTML(insp, loc.id + "-" + i, text); }).join("");
      body = '<div class="locbody"><button class="markall" data-markall="' + loc.id + '">\u2713 Mark all remaining in this area as Met</button>' + itemsHtml + '</div>';
    }
    return '<div class="locblock" id="loc-' + loc.id + '">' +
      '<button class="lochead' + (open ? " open" : "") + '" data-loc="' + loc.id + '">' +
      '<span>' + loc.icon + '</span><span class="nm">' + esc(loc.name) + '</span>' +
      '<span class="ct">' + s.done + '/' + s.total + '</span><span>' + (open ? "\u25BE" : "\u25B8") + '</span></button>' + body + '</div>';
  }).join("");
  return '<div class="sticky"><div class="shead">' +
    '<button class="backbtn" data-nav="home" aria-label="Back">\u2190</button>' +
    '<div class="stitle"><div class="t">' + esc(insp.department) + '</div>' +
    '<div class="m">' + esc(insp.date) + ' \u00B7 ' + t.done + '/' + TOTAL_ITEMS + ' assessed' +
    (t.findings ? ' \u00B7 <span class="findct">' + t.findings + ' finding' + (t.findings > 1 ? "s" : "") + '</span>' : "") + '</div></div>' +
    '<div id="savestate" class="savestate' + (S.saveState === "error" ? " err" : "") + '">' +
    (S.saveState === "saving" ? "Saving\u2026" : S.saveState === "error" ? "Save failed \u2014 tap to retry" : "Saved \u2713") + '</div></div>' +
    '<div class="rail">' + rail + '</div></div>' +
    '<div class="locwrap">' + blocks +
    '<div class="gennotes"><div class="h">General notes for this visit</div>' +
    '<textarea class="note" id="generalNotes" rows="3" placeholder="Observations, staff interviews, follow-ups\u2026">' + esc(insp.generalNotes || "") + '</textarea></div></div>' +
    '<div class="bottombar"><button class="btn btn-ghost bb1" data-nav="report">Preview report</button>' +
    '<button class="btn btn-dark bb2" data-finish="1">Finish inspection</button></div>';
}

function itemHTML(insp, id, text){
  var it = insp.items[id] || { status:null, note:"", photos:[] };
  var st = it.status;
  var hasDetail = (it.note && it.note.length) || (it.photos && it.photos.length);
  var showDetail = S.expanded[id] || st === "notmet" || hasDetail;
  var tri = ["met","notmet","na"].map(function(v){
    var label = v === "met" ? "Met" : v === "notmet" ? "Not met" : "N/A";
    return '<button class="tbtn ' + v + (st === v ? " on" : "") + '" data-st="' + v + '" data-item="' + id + '">' + label + '</button>';
  }).join("");
  var detail = "";
  if (showDetail){
    var photos = (it.photos || []).map(function(p, i){
      return '<div class="ph"><img src="' + p + '" alt="attached">' +
        '<button class="x" data-delphoto="' + id + '" data-idx="' + i + '" aria-label="Remove photo">\u2715</button></div>';
    }).join("");
    detail = '<div class="detail">' +
      '<textarea class="note' + (st === "notmet" ? " nm" : "") + '" rows="2" data-note="' + id + '" placeholder="' + (st === "notmet" ? "Describe the finding\u2026" : "Optional comment\u2026") + '">' + esc(it.note || "") + '</textarea>' +
      '<div class="photorow">' + photos +
      '<button class="addph" data-addphoto="' + id + '">\uD83D\uDCF7 Add</button></div></div>';
  } else {
    detail = '<button class="expand" data-expand="' + id + '">+ Add note or photo</button>';
  }
  return '<div class="item"><div class="itxt">' + esc(text) + '</div><div class="tri">' + tri + '</div>' + detail + '</div>';
}

function ring(done, total){
  var size = 26, r = (size - 6) / 2, circ = 2 * Math.PI * r;
  var pct = total ? done / total : 0;
  var color = pct === 1 ? "#50A583" : "#F2C65A";
  return '<svg width="' + size + '" height="' + size + '" style="flex-shrink:0">' +
    '<circle cx="13" cy="13" r="' + r + '" fill="none" stroke="#e4e0d3" stroke-width="4"></circle>' +
    '<circle cx="13" cy="13" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct)) + '" stroke-linecap="round" transform="rotate(-90 13 13)"></circle>' +
    '<text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="9" font-weight="700" fill="#21382c">' + done + '</text></svg>';
}

function reportHTML(){
  var insp = cur();
  var t = totals(insp);
  var findingsHtml = "";
  LOCATIONS.forEach(function(loc){
    var f = [];
    loc.items.forEach(function(text, i){
      var it = insp.items[loc.id + "-" + i];
      if (it && it.status === "notmet") f.push({ text:text, it:it });
    });
    if (!f.length) return;
    findingsHtml += '<div class="findloc">' + loc.icon + ' ' + esc(loc.name) + '</div>' +
      f.map(function(x){
        var ph = (x.it.photos && x.it.photos.length) ?
          '<div class="fp">' + x.it.photos.map(function(p){ return '<img src="' + p + '" alt="finding">'; }).join("") + '</div>' : "";
        return '<div class="finding"><div class="ft">' + esc(x.text) + '</div>' +
          (x.it.note ? '<div class="fn">' + esc(x.it.note) + '</div>' : "") + ph + '</div>';
      }).join("");
  });
  if (!t.findings) findingsHtml = '<div class="empty">No "Not Met" findings recorded. \uD83C\uDF89</div>';
  var shareBtn = (PDF && !S.pdfBusy) ? '<button class="btn btn-share" data-sharepdf="1">\uD83D\uDCE4 Share / save PDF \u2014 Files, email, AirDrop, print</button>' : "";
  var secondBtn = insp.status === "complete" ?
    '<button class="btn btn-ghost" data-reopen="1">Reopen & edit</button>' :
    '<button class="btn btn-ghost" data-nav="inspect">Back to checklist</button>';
  return '<div class="topbar"></div>' +
    '<div style="padding:14px 16px 0"><img src="' + LOGO + '" alt="WCCHC" style="width:170px;height:auto;display:block"></div>' +
    '<div class="rephead"><button class="backbtn" data-nav="home" aria-label="Home">\u2190</button>' +
    '<div><div class="t">' + esc(insp.department) + '</div>' +
    '<div class="m">' + esc(insp.date) + ' \u00B7 ' + (insp.status === "complete" ? "Complete" : "In progress") + '</div></div></div>' +
    '<div class="stats">' +
    '<div class="stat g"><div class="v">' + t.done + '/' + TOTAL_ITEMS + '</div><div class="l">Assessed</div></div>' +
    '<div class="stat ' + (t.findings ? "c" : "g") + '"><div class="v">' + t.findings + '</div><div class="l">Findings</div></div>' +
    '<div class="stat s"><div class="v">' + t.photos + '</div><div class="l">Photos</div></div></div>' +
    '<div class="actions">' +
    '<button class="btn btn-pdf" data-buildpdf="1"' + (S.pdfBusy ? " disabled" : "") + '>' +
    (S.pdfBusy ? "Building PDF\u2026" : PDF ? "\uD83D\uDD04 Rebuild PDF report" : "\uD83D\uDCC4 Build PDF report (findings + photos)") + '</button>' +
    shareBtn +
    '<div class="rowbtns"><button class="btn btn-ghost" data-copy="1">Copy report text</button>' + secondBtn + '</div></div>' +
    '<div class="findsec">' + findingsHtml +
    '<div class="findloc" style="margin-top:16px">Text report (copy above, or long-press to select)</div></div>' +
    '<pre class="txtreport">' + esc(buildReport(insp)) + '</pre>';
}

/* ------------------ Events ------------------ */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-open],[data-del],[data-nav],[data-loc],[data-st],[data-expand],[data-addphoto],[data-delphoto],[data-markall],[data-finish],[data-reopen],[data-copy],[data-buildpdf],[data-sharepdf],#startBtn,#savestate");
  if (!el) return;

  if (el.id === "startBtn"){
    var dept = (document.getElementById("deptInput").value || "").trim();
    if (!dept) return;
    var now = new Date();
    var id = now.getTime().toString(36);
    DB.insp[id] = { id:id, department:dept, date:now.toISOString().slice(0,10), createdAt:now.toISOString(), status:"in-progress", items:{}, generalNotes:"" };
    DB.order.unshift(id);
    persist();
    S.id = id; S.screen = "inspect"; S.openLoc = LOCATIONS[0].id; S.expanded = {}; PDF = null;
    render();
    return;
  }
  if (el.id === "savestate"){
    if (S.saveState === "error") persist();
    return;
  }
  if (el.dataset.open){
    S.id = el.dataset.open; PDF = null; S.expanded = {}; S.openLoc = null;
    S.screen = DB.insp[S.id].status === "complete" ? "report" : "inspect";
    render(); window.scrollTo(0,0);
    return;
  }
  if (el.dataset.del){
    var x = DB.insp[el.dataset.del];
    if (x && confirm("Delete the " + x.department + " inspection from " + x.date + "? This cannot be undone.")){
      delete DB.insp[el.dataset.del];
      DB.order = DB.order.filter(function(i){ return i !== el.dataset.del; });
      persist(); render(); toast("Inspection deleted");
    }
    return;
  }
  if (el.dataset.nav){
    S.screen = el.dataset.nav; render(); window.scrollTo(0,0);
    return;
  }
  if (el.dataset.loc){
    S.openLoc = (S.openLoc === el.dataset.loc && !el.dataset.scroll) ? null : el.dataset.loc;
    render();
    if (el.dataset.scroll){
      var target = document.getElementById("loc-" + el.dataset.loc);
      if (target) setTimeout(function(){ target.scrollIntoView({ behavior:"smooth", block:"start" }); }, 60);
    }
    return;
  }
  if (el.dataset.st){
    var it = getItem(cur(), el.dataset.item);
    it.status = (it.status === el.dataset.st) ? null : el.dataset.st;
    persist(); render();
    return;
  }
  if (el.dataset.expand){
    S.expanded[el.dataset.expand] = true; render();
    return;
  }
  if (el.dataset.addphoto){
    var itp = getItem(cur(), el.dataset.addphoto);
    if ((itp.photos || []).length >= 4){ toast("Max 4 photos per item"); return; }
    photoTarget = el.dataset.addphoto;
    document.getElementById("photoInput").click();
    return;
  }
  if (el.dataset.delphoto){
    var itd = getItem(cur(), el.dataset.delphoto);
    itd.photos.splice(Number(el.dataset.idx), 1);
    persist(); render();
    return;
  }
  if (el.dataset.markall){
    var locId = el.dataset.markall;
    var loc = LOCATIONS.find(function(l){ return l.id === locId; });
    loc.items.forEach(function(_, i){
      var iti = getItem(cur(), locId + "-" + i);
      if (!iti.status) iti.status = "met";
    });
    persist(); render();
    return;
  }
  if (el.dataset.finish){
    var insp = cur();
    insp.status = "complete"; insp.completedAt = new Date().toISOString();
    persist(); S.screen = "report"; render(); window.scrollTo(0,0);
    return;
  }
  if (el.dataset.reopen){
    cur().status = "in-progress";
    persist(); S.screen = "inspect"; render(); window.scrollTo(0,0);
    return;
  }
  if (el.dataset.copy){
    var text = buildReport(cur());
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Report copied to clipboard"); },
        function(){ toast("Copy failed \u2014 long-press the text to copy"); });
    } else toast("Copy failed \u2014 long-press the text to copy");
    return;
  }
  if (el.dataset.buildpdf){ buildPdf(); return; }
  if (el.dataset.sharepdf){ sharePdf(); return; }
});

document.addEventListener("input", function(e){
  var el = e.target;
  if (el.id === "deptInput"){
    document.getElementById("startBtn").disabled = !el.value.trim();
    return;
  }
  if (el.id === "generalNotes"){
    cur().generalNotes = el.value; persist();
    return;
  }
  if (el.dataset && el.dataset.note){
    getItem(cur(), el.dataset.note).note = el.value; persist();
    return;
  }
});

document.getElementById("photoInput").addEventListener("change", async function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = "";
  if (!files.length || !photoTarget) return;
  var it = getItem(cur(), photoTarget);
  var room = 4 - (it.photos || []).length;
  if (room <= 0){ toast("Max 4 photos per item"); return; }
  if (files.length > room) toast("Only " + room + " more photo" + (room > 1 ? "s" : "") + " fit \u2014 max 4 per item");
  var list = files.slice(0, room);
  for (var i = 0; i < list.length; i++){
    try {
      var dataUrl = await compressImage(list[i]);
      it.photos.push(dataUrl);
    } catch(err){
      console.error(err);
      toast("Could not process a photo \u2014 skipped it");
    }
  }
  photoTarget = null;
  persist(); render();
});

render();
</script>
</body>
</html>
